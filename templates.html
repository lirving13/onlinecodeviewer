<!DOCTYPE html>
<html lang="en-GB" class="light-theme">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary Meta Tags -->
  <title>Coding Templates Library – Free HTML, CSS & JS Boilerplates</title>
  <meta name="description" content="Browse our free library of HTML, CSS & JavaScript templates and starter kits—landing pages, portfolios, dashboards, blogs and more. Instantly load into the Online Code Viewer."/>
  <meta name="keywords" content="
    HTML templates,
    CSS boilerplates,
    JavaScript starter kits,
    landing page templates,
    portfolio templates,
    dashboard templates,
    blog templates,
    free code snippets,
    front-end templates,
    online code viewer templates
  "/>
  <meta name="robots" content="index, follow"/>
  <meta name="theme-color" content="#1e88e5"/>

  <!-- Canonical & Hreflang -->
  <link rel="canonical" href="https://www.onlinecodeviewer.com/templates.html"/>
  <link rel="alternate" hreflang="en-GB" href="https://www.onlinecodeviewer.com/templates.html"/>

  <!-- Favicons -->
  <link rel="icon" href="/favicon.ico"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>

  <!-- Open Graph -->
  <meta property="og:site_name" content="OnlineCodeViewer"/>
  <meta property="og:title" content="Coding Templates Library – Free HTML, CSS & JS Boilerplates"/>
  <meta property="og:description" content="Browse free HTML, CSS & JavaScript templates and starter kits—landing pages, portfolios, dashboards, blogs and more."/>
  <meta property="og:url" content="https://www.onlinecodeviewer.com/templates.html"/>
  <meta property="og:image" content="https://www.onlinecodeviewer.com/assets/images/templates-og.png"/>
  <meta property="og:type" content="website"/>

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:site" content="@OnlineCodeViewer"/>
  <meta name="twitter:title" content="Coding Templates Library – Free HTML, CSS & JS Boilerplates"/>
  <meta name="twitter:description" content="Browse free HTML, CSS & JavaScript templates and starter kits—landing pages, portfolios, dashboards, blogs and more."/>
  <meta name="twitter:image" content="https://www.onlinecodeviewer.com/assets/images/templates-twitter.png"/>

  <!-- JSON-LD: CollectionPage -->
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"CollectionPage",
    "name":"Templates Library",
    "description":"Free HTML, CSS & JavaScript templates for landing pages, portfolios, dashboards, and more.",
    "hasPart":[
      {
        "@type":"CreativeWork",
        "name":"Landing Page Template",
        "url":"https://www.onlinecodeviewer.com/templates/landing-page.html"
      },
      {
        "@type":"CreativeWork",
        "name":"Portfolio Template",
        "url":"https://www.onlinecodeviewer.com/templates/portfolio.html"
      }
    ]
  }
  </script>

  <!-- Preconnect & Preload -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" href="assets/style.css" as="style">
  <link rel="stylesheet" href="assets/style.css">

  <!-- Scripts -->
  <script defer src="assets/script.js"></script>
</head>
<body>
  <!-- Header (copy exactly from index.html) -->
  <header class="site-header" role="banner">…</header>

  <!-- Breadcrumb -->
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <ol>
      <li><a href="index.html">Home</a></li>
      <li aria-current="page">Coding Templates</li>
    </ol>
  </nav>

  <!-- Hero -->
  <section class="hero small-hero">
    <div class="container">
      <h1>Templates Library</h1>
      <p>Choose from free HTML, CSS & JS templates to kickstart your project.</p>
    </div>
  </section>

  <!-- Filter/Search Controls -->
  <section class="template-controls">
    <div class="container">
      <input type="text" id="template-search" placeholder="Search templates…" aria-label="Search templates">
      <select id="template-category" aria-label="Filter by category">
        <option value="">All categories</option>
        <option value="landing">Landing Pages</option>
        <option value="portfolio">Portfolios</option>
        <option value="dashboard">Dashboards</option>
        <option value="blog">Blogs</option>
      </select>
    </div>
  </section>

  <!-- Templates Gallery -->
  <section class="templates-gallery">
    <div class="container grid">
      <!-- Example Card -->
      <article class="template-card" data-category="landing">
        <a href="templates/landing-page.html" class="template-thumb">
          <img src="assets/images/landing-thumb.png" alt="Landing Page Template Preview" loading="lazy">
        </a>
        <h2><a href="templates/landing-page.html">Landing Page Template</a></h2>
        <p>Clean, responsive landing page boilerplate with hero, features and call-to-action.</p>
        <button class="btn-load" data-template="landing-page">Load into Editor</button>
      </article>
      <!-- Repeat cards as needed -->
    </div>
  </section>

  <!-- Footer (copy from index.html) -->
  <footer class="site-footer" role="contentinfo">…</footer>
</body>
</html>
